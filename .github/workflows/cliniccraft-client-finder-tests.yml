name: ClinicCraft Client Finder Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ClinicCraft/client-finder/**"
      - ".github/workflows/cliniccraft-client-finder-tests.yml"
  pull_request:
    paths:
      - "ClinicCraft/client-finder/**"
      - ".github/workflows/cliniccraft-client-finder-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run offline regression tests
        run: python -m unittest discover -s ClinicCraft/client-finder -p 'test_*.py'
